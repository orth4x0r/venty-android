name: Build

# Private repo: Actions minutes are limited and builds normally happen locally,
# so this only runs when started by hand from the Actions tab.
on:
  workflow_dispatch:

# A newer push to the same PR cancels the run still going for the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: venty-apk
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
